<div class="flex flex-col md:flex-row max-w-7xl mx-auto items-center justify-between">
    <div class="w-full md:w-8/12 items-center md:items-start px-2 md:px-0">
        <p class="md:text-5xl text-3xl font-serif-elegant text-center md:text-start mt-2.5 md:mt-0">Tu camino hacia las respuestas</p>
        <p class="mt-2 mb-6 text-center md:text-start">Es muy fácil. Solo sigue estos pasos.</p>
        <div class="grid grid-cols-1 md:grid-cols-5 mt-4 items-center">
            @for (item of answerPath; track $index; let isLast = $last) {
            <div class="flex flex-col items-center text-center md:text-start md:items-start gap-y-2.5">
                <div class="flex flex-row items-center gap-x-3">
                    <div class="avatar avatar-placeholder">
                        <div class="bg-[#cfaa61] text-white w-14 rounded-full">
                            <span class="text-xl font-semibold">{{ $index + 1 }}</span>
                        </div>
                    </div>
                    <img src="images/svg/{{ item.icon }}.svg" class="size-10" />
                </div>
                <p class="text-lg font-medium md:my-2.5 my-1">{{ item.title }}</p>
                <p>{{ item.dscription }}</p>
            </div>
            @if(!isLast) {
           <span class="hidden md:block ">
             <span class="material-symbols-outlined" style="font-size: 3rem; color: #cfaa61; margin: auto">
                arrow_forward_ios
            </span>
           </span>
            }
            }
        </div>
    </div>
    <img src="images/landing/mobil-1-nbg.webp" alt="mobile1" class="h-96 mt-4 md: mt-0">
</div>
