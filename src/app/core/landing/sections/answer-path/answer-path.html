<div class="flex flex-col md:flex-row max-w-7xl mx-auto items-center justify-between">
    <div class="w-full md:w-8/12">
        <p class="text-5xl font-serif-elegant">Tu camino hacia las respuestas</p>
        <p class="mt-2 mb-6">Es muy fácil. Solo sigue estos pasos.</p>
        <div class="grid grid-cols-1 md:grid-cols-5 mt-4 items-center">
            @for (item of answerPath; track $index; let isLast = $last) {
            <div>
                <div class="flex flex-row items-center gap-x-3">
                    <div class="avatar avatar-placeholder">
                        <div class="bg-[#cfaa61] text-white w-14 rounded-full">
                            <span class="text-xl font-semibold">{{ $index + 1 }}</span>
                        </div>
                    </div>
                    <img src="images/svg/{{ item.icon }}.svg" class="size-10" />
                </div>
                <p class="text-lg font-medium my-2.5">{{ item.title }}</p>
                <p>{{ item.dscription }}</p>
            </div>
            @if(!isLast) {
            <span class="material-symbols-outlined" style="font-size: 3rem; color: #cfaa61; margin: auto">
                arrow_forward_ios
            </span>
            }
            }
        </div>
    </div>
    <img src="images/landing/mobil-1-nbg.webp" alt="mobile1" class="h-96">
</div>
