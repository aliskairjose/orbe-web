<div class="py-4 bg-[#1D4747] flex flex-col text-white banner-fondo">
    <p class="md:text-5xl text-3xl font-serif-elegant text-center">¿Qué quieres descubir hoy?</p>
    <p class="text-center mt-4">Elige el área que más te interesa y cinecta con el experto ideal para ti.</p>
    <div class="flex flex-row overflow-auto gap-2 justify-evenly mt-6 px-4">
        @for (item of categories; track $index) {
        <div class="flex flex-col flex-1 items-center border border-white/50 rounded-2xl pb-4 fondo">
            <img [src]="'images/misticos/0'+ ($index+1) +'_' + item.imagen +'.webp'" [alt]="item.label">
            <p class="text-white font-sm text-center ">{{item.label}}</p>
        </div>
        }
    </div>
</div>
