<div class="bg-white rounded-xl shadow-sm p-6">
  <div class="bg-white p-6 rounded-xl border border-gray-300 relative">
    <div class="mb-8 flex justify-between items-end">
      <div>
        <h2 class="text-xl font-medium text-gray-800">Tiempo acumulado {{ currentYear }}</h2>
        <p class="text-sm text-gray-500">Chats vs Llamadas (Porcentaje mensual)</p>
      </div>

      <!-- Leyenda -->
      <div class="flex gap-4 text-xs font-medium">
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 bg-sky-300 rounded-sm"></span> Chats
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 bg-green-300 rounded-sm"></span> Llamadas
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-3 h-3 bg-indigo-300 rounded-sm"></span> Video
        </div>
      </div>
    </div>

    <!-- Contenedor del Gráfico -->
    <div class="relative h-72 flex items-end justify-between gap-2 px-2 border-b border-gray-200">
      <!-- Líneas de referencia de fondo -->
      <div class="absolute inset-0 flex flex-col justify-between z-0 pointer-events-none">
        <div class="w-full border-t border-gray-200 h-0"></div>
        <div class="w-full border-t border-gray-200 h-0"></div>
        <div class="w-full border-t border-gray-200 h-0"></div>
        <div class="w-full border-t border-gray-200 h-0"></div>
      </div>

      <!-- Barras -->
      @for (item of stats(); track $index) {
      <div class="flex-1 flex flex-col items-center group relative z-10">
        <div class="flex items-end gap-1 w-full justify-center h-64">
          <!-- Barra Chat -->
          <div [style.height.%]="item.texto"
            class="w-3 md:w-5 bg-indigo-300 rounded-t-sm transition-all duration-300 hover:bg-indigo-400 relative">
            <!-- Tooltip al hacer hover -->
            <span
              class="opacity-0 group-hover:opacity-100 absolute -top-8 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-[10px] py-1 px-2 rounded shadow-lg transition-opacity whitespace-nowrap">
              {{ item.texto | number: '1.2-2'}}%
            </span>
          </div>

          <!-- Barra Llamada -->
          <div [style.height.%]="item.llamada"
            class="w-3 md:w-5 bg-green-300 rounded-t-sm transition-all duration-300 hover:bg-green-400 relative">
            <span
              class="opacity-0 group-hover:opacity-100 absolute -top-8 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-[10px] py-1 px-2 rounded shadow-lg transition-opacity whitespace-nowrap">
              {{ item.llamada | number: '1.2-2'}}%
            </span>
          </div>

          <!-- Barra Video -->
          <div [style.height.%]="item.video"
            class="w-3 md:w-5 bg-indigo-300 rounded-t-sm transition-all duration-300 hover:bg-indigo-400 relative">
            <span
              class="opacity-0 group-hover:opacity-100 absolute -top-8 left-1/2 -translate-x-1/2 bg-gray-800 text-white text-[10px] py-1 px-2 rounded shadow-lg transition-opacity whitespace-nowrap">
              {{ item.video | number: '1.2-2'}}%
            </span>
          </div>
        </div>

        <!-- Etiqueta Mes -->
        <span class="mt-3 text-[10px] md:text-xs font-bold text-gray-400 uppercase tracking-wider">
          {{ item.month }}
        </span>
      </div>
      }
    </div>
  </div>
</div>
