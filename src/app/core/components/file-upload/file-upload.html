<div class="space-y-2">
  <label class="label-text" [for]="fileInputId">{{ label() }}</label>
  <input
    class="sr-only"
    [id]="fileInputId"
    type="file"
    [accept]="acceptedFiles()"
    [multiple]="!singleton()"
    (change)="upload($event)"
  />

  <div
    class="bg-base-200/60 rounded-box flex flex-col justify-center border-2 border-base-content/20 border-dashed transition-colors"
    [class.border-primary]="isDragging()"
    (dragover)="$event.preventDefault(); isDragging.set(true)"
    (dragleave)="isDragging.set(false)"
    (drop)="handleDrop($event)"
  >
    @if (!selectedFile()) {
      <label class="text-center cursor-pointer p-12" [for]="fileInputId">
        <p class="text-base-content/50 mb-3 text-sm">Elige un archivo de hasta 1 MB.</p>
        <span class="btn btn-soft btn-sm btn-primary text-nowrap">
          <span class="icon-[tabler--file-upload] size-4.5 shrink-0"></span>
          Arrastra o selecciona un archivo
        </span>
        <p class="text-base-content/50 my-2 text-xs">o</p>
        <span class="link link-animated link-primary font-medium text-sm">Buscar archivo</span>
      </label>
    } @else {
      <div class="bg-base-100 rounded-box p-3 shadow-lg">
        <div class="mb-1 flex items-center justify-between">
          <div class="flex min-w-0 items-center gap-x-3">
            <span class="text-base-content/80 border-base-content/20 flex size-8 shrink-0 items-center justify-center rounded-lg border p-0.5">
              <span class="icon-[tabler--file] size-5"></span>
            </span>
            <div class="min-w-0">
              <p class="text-base-content text-sm font-medium">
                <span class="inline-block max-w-56 truncate align-bottom">{{ selectedFile()?.name }}</span>
              </p>
              <p class="text-base-content/50 text-xs">{{ fileSize() }}</p>
            </div>
          </div>
          <div class="flex shrink-0 items-center">
            <button type="button" class="btn btn-sm btn-circle btn-text" aria-label="Reemplazar archivo" (click)="reloadFile()">
              <span class="icon-[tabler--refresh] size-4 shrink-0"></span>
            </button>
            <button type="button" class="btn btn-sm btn-circle btn-text" aria-label="Quitar archivo" (click)="removeFile()">
              <span class="icon-[tabler--trash] size-4 shrink-0"></span>
            </button>
          </div>
        </div>
        <div class="flex items-center gap-x-3 whitespace-nowrap">
          <div class="progress h-2" role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-bar progress-success" style="width: 100%"></div>
          </div>
          <span class="text-base-content mb-0.5 text-sm">100%</span>
        </div>
      </div>
    }
  </div>

  @if (errorMessage()) {
    <p class="text-error text-xs" role="alert">{{ errorMessage() }}</p>
  }
</div>
