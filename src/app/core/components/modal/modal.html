@if (isOpen()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 transition-opacity animate-fade-in"
  >
    <div
      class="bg-white dark:bg-slate-800 rounded-lg shadow-xl max-w-md w-full overflow-hidden transform transition-all scale-100 p-6 flex flex-col gap-4"
    >
      <div class="flex justify-between items-center">
        <h3 class="text-xl font-semibold text-slate-900 dark:text-white">
          {{ title() }}
        </h3>
        <button
          type="button"
          aria-label="Cerrar modal"
          (click)="onClose(false)"
          class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-6 h-6"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="text-slate-600 dark:text-slate-300">
        <ng-content></ng-content>
      </div>

      <div class="flex justify-end gap-3 pt-3">
        <button
          (click)="onClose(false)"
          class="px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors"
        >
          Cancelar
        </button>
        <button
          (click)="onClose(true)"
          class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 shadow-md shadow-indigo-500/20 transition-colors"
        >
          Aceptar
        </button>
      </div>
    </div>
  </div>
}
