<div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 relative">
  <div class="flex items-center justify-between mb-4">
    <div>
      <h3 id="role-charts-heading" class="text-xl font-semibold text-gray-800">Consultas</h3>
      <p class="text-sm text-gray-500">Contador de consultas aceptadas y rechazadas</p>
    </div>
  </div>
  <div class="space-y-5 mb-4" role="img">
    @for (role of requestCount(); track role.type) {
      <div>
        <div class="flex items-center justify-between text-sm font-medium text-gray-700 mb-2">
          <span>{{ role.type }}</span>
          <span>{{ role.count }}</span>
        </div>
        <div class="h-4 rounded-full bg-slate-100 overflow-hidden">
          <div
            class="h-4 rounded-full"
            [class.bg-sky-300]="role.type==='Aceptado'"
            [class.bg-green-300]="role.type==='Rechazado'"
            [style.width.%]="(role.count / totalRequests()) * 100"
          ></div>
        </div>
      </div>
    }
  </div>
  <div class="text-right">
    <p class="text-sm font-medium text-gray-500">Total consultas: {{ totalRequests() }}</p>
  </div>
</div>
