<div class="w-full max-w-4xl mx-auto p-6 bg-white rounded-3xl shadow-xl border border-slate-100">
  <div class="mb-8 flex justify-between items-end">
    <div>
      <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Registros 2025</h2>
      <p class="text-slate-500 text-sm">Comparativa mensual: Usuarios vs Asesores</p>
    </div>
    
    <div class="flex gap-4 text-xs font-medium uppercase tracking-wider">
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 bg-blue-500 rounded-sm"></span>
        <span class="text-slate-600">Clientes</span>
      </div>
      <div class="flex items-center gap-2">
        <span class="w-3 h-3 bg-indigo-400 rounded-sm"></span>
        <span class="text-slate-600">Asesores</span>
      </div>
    </div>
  </div>

  <div class="relative h-64 w-full flex items-end gap-2 sm:gap-4 border-b border-slate-200 pb-2">
    
    <div class="absolute inset-0 flex flex-col justify-between pointer-events-none">
      <div class="border-t border-slate-100 w-full h-0"></div>
      <div class="border-t border-slate-100 w-full h-0"></div>
      <div class="border-t border-slate-100 w-full h-0"></div>
    </div>

    @for (data of monthlyData(); track data.month) {
      <div class="flex-1 flex flex-col items-center gap-1 group relative">
        
        <div class="w-full flex items-end justify-center gap-0.5 h-48">
          <div 
            class="w-full max-w-3 bg-blue-500 rounded-t-sm transition-all duration-500 hover:bg-blue-600 cursor-help relative group/tooltip"
            [style.height.%]="(data.users / maxVal()) * 100"
          >
             <span class="absolute -top-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover/tooltip:opacity-100 transition-opacity">
               {{data.users}}
             </span>
          </div>

          <div 
            class="w-full max-w-3 bg-indigo-400 rounded-t-sm transition-all duration-500 hover:bg-indigo-500 cursor-help relative group/tooltip"
            [style.height.%]="(data.advisors / maxVal()) * 100"
          >
            <span class="absolute -top-8 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover/tooltip:opacity-100 transition-opacity">
              {{data.advisors}}
            </span>
          </div>
        </div>

        <span class="text-[10px] sm:text-xs font-medium text-slate-400 mt-2 rotate-45 sm:rotate-0">
          {{ data.month }}
        </span>
      </div>
    }
  </div>
</div>
