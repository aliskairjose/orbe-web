    <div class="bg-white p-6 rounded-xl border border-gray-300 relative">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h3 id="role-charts-heading" class="text-xl font-semibold text-gray-800">
            Consultas Mayo
          </h3>
          <p class="text-sm text-gray-500">Contador de consultas por chat y llamada</p>
        </div>
        <p class="text-sm font-medium text-gray-700">Total consultas: {{ totalRequests() }}</p>
      </div>

      <div
        class="space-y-5"
        role="img"
        aria-label="Bar chart showing counts for User and Advisor roles"
      >
        @for (role of requestCount(); track role.type) {
          <div>
            <div class="flex items-center justify-between text-sm font-medium text-gray-700 mb-2">
              <span>{{ role.type }}</span>
              <span>{{ role.count }}</span>
            </div>
            <div class="h-4 rounded-full bg-slate-100 overflow-hidden">
              <div
                class="h-4 rounded-full"
                [style.width.%]="(role.count / totalRequests()) * 100"
                [style.backgroundColor]="role.color"
              ></div>
            </div>
          </div>
        }
      </div>
    </div>
