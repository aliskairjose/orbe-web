<div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 relative">
  <div class="flex items-center justify-between mb-4">
    <div>
      <h3 class="text-xl font-medium text-gray-800">
       Consultas {{currentMonth | titlecase}}</h3>
      <p class="text-sm text-gray-500">Contador de consultas por Chat, Voz y Video</p>
    </div>
  </div>
  <div class="space-y-5 mb-4" role="img">
    @if(resource.hasValue()){
      @for (role of resource.value(); track role._id) {
        <div>
          <div class="flex items-center justify-between text-sm font-medium text-gray-700 mb-2">
            <span>{{ types[role._id] }}</span>
            <span>{{ role.total }}</span>
          </div>
          <div class="h-4 rounded-full bg-slate-100 overflow-hidden">
            <div
              class="h-4 rounded-full"
              [class.bg-sky-300]="role._id==='chat'"
              [class.bg-green-300]="role._id==='voice'"
              [class.bg-indigo-300]="role._id==='video'"
              [style.width.%]="(role.total / totalRequests()) * 100"
            ></div>
          </div>
        </div>
      }
    }
  </div>
  <div class="text-right">
    <p class="text-sm font-medium text-gray-500">Total consultas: {{ totalRequests() }}</p>
  </div>
</div>
