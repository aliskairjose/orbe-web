<nav class="tabs tabs-bordered" aria-label="Tabs" role="tablist" aria-orientation="horizontal">
  <button
    type="button"
    class="tab active-tab:tab-active active"
    id="tabs-basic-item-1"
    data-tab="#tabs-basic-1"
    aria-controls="tabs-basic-1"
    role="tab"
    aria-selected="true"
  >
    Políticas de uso de los usuarios
  </button>
  <button
    type="button"
    class="tab active-tab:tab-active"
    id="tabs-basic-item-2"
    data-tab="#tabs-basic-2"
    aria-controls="tabs-basic-2"
    role="tab"
    aria-selected="false"
  >
    Políticas Internas para Expertos
  </button>
  <button
    type="button"
    class="tab active-tab:tab-active"
    id="tabs-basic-item-3"
    data-tab="#tabs-basic-3"
    aria-controls="tabs-basic-3"
    role="tab"
    aria-selected="false"
  >
    Políticas de privacidad
  </button>
  <button
    type="button"
    class="tab active-tab:tab-active"
    id="tabs-basic-item-4"
    data-tab="#tabs-basic-4"
    aria-controls="tabs-basic-4"
    role="tab"
    aria-selected="false"
  >
    Preguntas frecuentes
  </button>
</nav>

<div class="mt-3">
  <div id="tabs-basic-1" role="tabpanel" aria-labelledby="tabs-basic-item-1">
    <form [formRoot]="userPoliciesF">
      <editor [init]="init" licenseKey="gpl" formControlName="content"  [formField]="userPoliciesF.content" />
      <button class="btn btn-primary mt-4" type="submit">Guardar</button>
    </form>
  </div>
  <div id="tabs-basic-2" class="hidden" role="tabpanel" aria-labelledby="tabs-basic-item-2">
    <form [formRoot]="advisorPoliciesF">
      <editor [init]="init" licenseKey="gpl" formControlName="content"  [formField]="advisorPoliciesF.content" />
      <button class="btn btn-primary mt-4" type="submit">Guardar</button>
    </form>
  </div>
  <div id="tabs-basic-3" class="hidden" role="tabpanel" aria-labelledby="tabs-basic-item-3">
    <form [formRoot]="policiesF">
      <editor [init]="init" licenseKey="gpl" formControlName="content"  [formField]="policiesF.content" />
      <button class="btn btn-primary mt-4" type="submit">Guardar</button>
    </form>
  </div>
  <div id="tabs-basic-4" class="hidden" role="tabpanel" aria-labelledby="tabs-basic-item-4">
    <form [formRoot]="faqF">
      <editor [init]="init" licenseKey="gpl" formControlName="content"  [formField]="faqF.content" />
      <button class="btn btn-primary mt-4" type="submit">Guardar</button>
    </form>
  </div>
</div>
