<div class="min-h-screen bg-gray-100 flex">
  <aside
    id="sidebar"
    class="fixed inset-y-0 left-0 z-50 w-64 bg-white text-white transform transition-transform duration-300 ease-in-out lg:static lg:translate-x-0 lg:inset-0 shadow-lg"
    [class.-translate-x-full]="!isSidebarOpen()"
    [class.translate-x-0]="isSidebarOpen()"
  >
    <div class="flex items-center justify-between h-16 px-6 bg-white">
      <span class="text-2xl font-bold tracking-wider text-blue-400">Orbe</span>
      <button
        (click)="toggleSidebar()"
        class="lg:hidden p-2 rounded-md hover:bg-slate-800 focus:outline-none"
        [attr.aria-label]="isSidebarOpen() ? 'Cerrar menú' : 'Abrir menú'"
        [attr.aria-expanded]="isSidebarOpen().toString()"
        aria-controls="sidebar"
      >
        <svg
          class="w-6 h-6"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button>
    </div>

    <nav aria-label="Main dashboard navigation" class="mt-6 px-4 space-y-2">
      <a
        routerLink="."
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="active-link"
        class="sidebar-link"
      >
        <span class="material-symbols-outlined"> dashboard </span>
        Inicio
      </a>
      <a
        routerLink="users"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="active-link"
        class="sidebar-link"
      >
        <span class="material-symbols-outlined"> account_circle </span>
        Usuarios
      </a>
      <a
        routerLink="chats"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="active-link"
        class="sidebar-link"
      >
        <span class="material-symbols-outlined">message</span>
        Chats
      </a>
      <a
        routerLink="categories"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="active-link"
        class="sidebar-link"
      >
        <span class="material-symbols-outlined">category</span>

        Categorías
      </a>
      <a
        routerLink="transactions"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="active-link"
        class="sidebar-link"
      >
        <span class="material-symbols-outlined"> finance_mode </span>
        Transacciones
      </a>
      <a
        routerLink="banks"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="active-link"
        class="sidebar-link"
      >
        <span class="material-symbols-outlined"> account_balance </span>
        Bancos
      </a>
      <a
        routerLink="bank-accounts"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="active-link"
        class="sidebar-link"
      >
        <span class="material-symbols-outlined"> account_balance </span>
        Cuentas
      </a>
      <a
        routerLink="legals"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="active-link"
        class="sidebar-link"
      >
        <span class="material-symbols-outlined"> contract_edit </span>
        Legal
      </a>
      <a
        routerLink="plans"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="active-link"
        class="sidebar-link"
      >
        <span class="material-symbols-outlined"> view_object_track </span>
        Planes y paquetes
      </a>
    </nav>
  </aside>

  <div
    class="fixed inset-0 bg-slate-900/60 z-40 lg:hidden transition-opacity duration-300 h-screen overflow-auto"
    [class.pointer-events-none]="!isSidebarOpen()"
    [class.opacity-0]="!isSidebarOpen()"
    (click)="toggleSidebar()"
    aria-hidden="true"
  ></div>

  <div class="flex-1 min-w-0 h-screen overflow-x-hidden overflow-y-scroll">
    <header class="flex items-center justify-between h-16 border-b border-gray-200 mx-6">
      <div class="flex items-center">
        <button
          (click)="toggleSidebar()"
          class="lg:hidden p-2 rounded-md text-gray-600 hover:bg-gray-100 focus:outline-none"
          aria-label="Abrir menú"
        >
          <span class="material-symbols-outlined"> menu </span>
        </button>
        <h1 class="ml-4 text-xl font-semibold text-gray-800">Resumen General</h1>
      </div>
      <div class="flex items-center space-x-4">
        <div class="flex flex-row items-center gap-x-3">
          <span
            class="text-gray-500 text-sm inline-flex items-center gap-x-1 cursor-pointer"
            (click)="updateRate()"
          >
            Tasa: {{ rate() | currency }}
            <span class="material-symbols-outlined"> currency_exchange </span>
          </span>

          <div class="relative shrink-0">
            <img
              [src]="user().avatar"
              [alt]="user().name"
              class="w-10 h-10 rounded-full border border-gray-200 object-cover"
            />
            <span
              class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-500 border-2 border-white rounded-full"
            ></span>
          </div>
        </div>
      </div>
    </header>

    <main class="flex-1 min-h-screen bg-gray-100 p-6 dashboard-main">
      <router-outlet />
    </main>
  </div>
</div>
