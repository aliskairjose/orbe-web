<div class="min-h-screen bg-gray-100 flex">
  <aside
    id="sidebar"
    class="fixed inset-y-0 left-0 z-50 w-[90vw] md:w-64 bg-white text-white transform transition-transform duration-300 ease-in-out lg:static lg:translate-x-0 lg:inset-0 shadow-lg"
    [class.-translate-x-full]="!isSidebarOpen()"
    [class.translate-x-0]="isSidebarOpen()"
  >
    <div class="flex items-center justify-between h-16 px-6 bg-white">
      <span class="text-2xl font-semibold tracking-widest text-green-800">Orbe</span>
      <button
        (click)="toggleSidebar()"
        class="lg:hidden flex items-center p-1.5 rounded-md text-gray-600 bg-gray-100 hover:bg-gray-100 focus:outline-none"
        aria-label="Abrir menú"
      >
        <span class="material-symbols-outlined"> close </span>
      </button>
    </div>

    <nav aria-label="Main dashboard navigation" class="mt-6 px-4 space-y-2">
      @for (m of menu; track $index) {
        <a
          [routerLink]="m.path"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive="active-link"
          class="sidebar-link"
        >
          <span class="material-symbols-outlined"> {{ m.icon }} </span>
          <span class="text-sm">{{ m.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <div
    class="fixed inset-0 bg-slate-900/60 z-40 lg:hidden transition-opacity duration-300 h-screen overflow-auto"
    [class.pointer-events-none]="!isSidebarOpen()"
    [class.opacity-0]="!isSidebarOpen()"
    (click)="toggleSidebar()"
    aria-hidden="true"
  ></div>

  <div class="flex-1 min-w-0 h-screen overflow-x-hidden overflow-y-scroll">
    <header class="flex items-center justify-between h-16 border-b border-gray-200 md:mx-6">
      <div class="flex items-center justify-around md:justify-between w-full md:w-fit">
        <button
          (click)="toggleSidebar()"
          class="lg:hidden md:p-2 rounded-md text-gray-600 hover:bg-gray-100 focus:outline-none"
          aria-label="Abrir menú"
        >
          <span class="material-symbols-outlined"> menu </span>
        </button>
        <h1 class="md:ml-4 text-xl font-semibold text-gray-800">Resumen General</h1>
        <button
          (click)="toggleSubBar()"
          class="lg:hidden md:p-2 rounded-md text-gray-600 hover:bg-gray-100 focus:outline-none"
          aria-label="Abrir menú"
        >
          <span class="material-symbols-outlined"> more_horiz </span>
        </button>
      </div>
      <div class="hidden md:flex items-center space-x-4 mr-4">
        <div class="flex flex-row items-center gap-x-4">
          <span
            class="text-gray-500 text-sm inline-flex items-center gap-x-1 cursor-pointer hover:text-gray-700 transition-colors"
            (click)="updateRate()"
          >
            Tasa: {{ rate() | currency }}
            <span class="material-symbols-outlined" style="font-size: 20px">
              currency_exchange
            </span>
          </span>

          <div class="avatar">
            <div class="size-10 rounded-full">
              <img
              [src]="user().avatar"
              [alt]="user().name"
            />
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Sub Bar -->
    <div
      [class.pointer-events-none]="!isSubBarOpen()"
      [class.hidden]="!isSubBarOpen()"
      class="flex items-center justify-between px-6 h-16 border-b border-gray-200 shadow md:mx-6 md:hidden"
    >
      <span
        class="text-gray-500 text-sm inline-flex items-center gap-x-1 cursor-pointer hover:text-gray-700 transition-colors"
        (click)="updateRate()"
      >
        Tasa: {{ rate() | currency }}
        <span class="material-symbols-outlined" style="font-size: 20px"> currency_exchange </span>
      </span>
      <div class="relative shrink-0">
        <img
          [src]="user().avatar"
          [alt]="user().name"
          class="w-10 h-10 rounded-full border border-gray-200 object-cover"
        />
        <span
          class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-500 border-2 border-white rounded-full"
        ></span>
      </div>
    </div>

    <main class="flex-1 min-h-screen bg-gray-100 p-6 dashboard-main">
      <router-outlet />
    </main>
  </div>
</div>
