<div class="bg-base-100 flex flex-col rounded-md shadow-base-300/20 shadow-sm">
  <div class="border-base-content/25 flex justify-end-safe items-center border-b px-5 py-3 gap-3 h-14">
  </div>
  <div class="overflow-x-auto">
    <div class="inline-block min-w-full align-middle">
      <div class="overflow-hidden">
        @if (resource.hasValue()) {
          <table class="table min-w-full" id="myTable">
            <thead>
              <tr>
                <th scope="col" class="group">
                  <div class="flex items-center justify-between">#</div>
                </th>
                <th scope="col" class="group">
                  <div class="flex items-center justify-between">Monto</div>
                </th>
                <th scope="col" class="group">
                  <div class="flex items-center justify-between">Bono</div>
                </th>
                <th scope="col" class="group">
                  <div class="flex items-center justify-between">Status</div>
                </th>
                <th scope="col" class="--exclude-from-ordering"></th>
              </tr>
            </thead>
            <tbody>
              @for (item of resource.value(); track $index) {
                <tr>
                  <td>{{ $index + 1 }}</td>
                  <td>{{ item.amount | currency }}</td>
                  <td>{{ item.bonus | currency }}</td>
                  <td>
                    <span
                      class="badge badge-soft badge-sm"
                      [class.badge-success]="item.isActive"
                      [class.badge-error]="!item.isActive"
                    >
                      {{ item.isActive ? 'Activo' : 'Inactivo' }}
                    </span>
                  </td>
                  <td>
                    <button class="btn btn-circle btn-text btn-sm" aria-label="Action button">
                      <span class="icon-[tabler--edit] size-5"></span>
                    </button>
                    <button class="btn btn-circle btn-text btn-sm" aria-label="Action button">
                      <span class="icon-[tabler--trash] size-5"></span>
                    </button>
                    <button class="btn btn-circle btn-text btn-sm" aria-label="Action button">
                      <span class="icon-[tabler--dots-vertical] size-5"></span>
                    </button>
                  </td>
                </tr>
              }
            </tbody>
          </table>
        } @else if (resource.error()) {
          <p>Ha ocurrido un error</p>
        }
      </div>
    </div>
  </div>
</div>
