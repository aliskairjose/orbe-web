<div class="p-8 min-h-screen">
  <div class="max-w-6xl mx-auto bg-white rounded-xl shadow-sm border border-gray-200">
    <!-- Header & Tabs -->
    <div class="border-b border-gray-200">
      <div class="flex p-4 items-center justify-between">
        <h2 class="text-xl font-bold text-gray-800">Paquetes</h2>
      </div>
    </div>

    <!-- Table Container -->
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Nombre
            </th>
            <th
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Monto
            </th>
            <th
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Bono
            </th>
            <th
              class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Estado
            </th>
            <th
              class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider"
            >
              Acciones
            </th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          <!-- Renderizado dinámico basado en la pestaña activa -->
          @for (plan of plans; track $index) {
            <tr class="hover:bg-gray-50 transition-colors">
              <td class="px-6 py-4 whitespace-nowrap">
                <span>{{ plan.name }}</span>
              </td>
              <td class="px-6 py-4 whitespace-nowrap">
                <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full">
                  {{ plan.amount | currency: 'USD' : 'symbol' }}
                </span>
              </td>
              <td class="px-6 py-4 whitespace-nowrap">
                <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full">
                  {{ plan.bonus | currency: 'USD' : 'symbol' }}
                </span>
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">
                <span
                  [class.bg-green-100]="plan.isActive"
                  [class.text-green-800]="plan.isActive"
                  [class.bg-red-100]="!plan.isActive"
                  [class.text-red-800]="!plan.isActive"
                  class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full text-green-500"
                >
                  {{ plan.isActive ? 'Activo' : 'Inactivo' }}
                </span>
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                <button class="text-blue-600 hover:text-blue-900">Editar</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
