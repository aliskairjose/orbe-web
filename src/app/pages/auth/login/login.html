<div class="login-page">
  <form (submit)="onSubmit($event)" class="login-form" novalidate>
    <h1 class="form-title">Login</h1>

    <div class="field">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        aria-describedby="email-error"
        [formField]="form.email"
        [class.invalid]="form.email().invalid() && form.email().touched()"
      />
      @if (form.email().touched() && form.email().invalid()) {
        <ul class="field-error">
          @for (error of form.email().errors(); track error) {
            <li>{{ error.message }}</li>
          }
        </ul>
      }
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        aria-describedby="password-error"
        [formField]="form.password"
        [class.invalid]="form.password().invalid() && form.password().touched()"
      />
      @if (form.password().touched() && form.password().invalid()) {
        <div class="field-error">
          @for (error of form.password().errors(); track error) {
            <p>{{ error.message }}</p>
          }
        </div>
      }
    </div>

    <button type="submit" >Log in</button>
  </form>
</div>
