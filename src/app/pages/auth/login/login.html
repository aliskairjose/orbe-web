<div class="login-page">
  <form [formGroup]="loginForm" (ngSubmit)="submit()" class="login-form" novalidate>
    <h1 class="form-title">Login</h1>

    <div *ngIf="loginError()" class="error-banner" role="alert">
      Invalid email or password.
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        autocomplete="email"
        aria-describedby="email-error"
        [class.invalid]="emailControl?.invalid && emailControl?.touched"
      />
      <p *ngIf="emailControl?.touched && emailControl?.invalid" id="email-error" class="field-error">
        <ng-container *ngIf="emailControl?.hasError('required')">Email is required.</ng-container>
        <ng-container *ngIf="!emailControl?.hasError('required') && emailControl?.hasError('email')">Enter a valid email address.</ng-container>
      </p>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        aria-describedby="password-error"
        [class.invalid]="passwordControl?.invalid && passwordControl?.touched"
      />
      <p *ngIf="passwordControl?.touched && passwordControl?.hasError('required')" id="password-error" class="field-error">
        Password is required.
      </p>
    </div>

    <button type="submit" [disabled]="loginForm.invalid">Log in</button>

    <p class="hint">Use <strong>user@example.com</strong> / <strong>password123</strong></p>
  </form>
</div>
